name: herm-mapper-external-db

services:
  herm-mapper:
    image: herm-mapper-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ./.env.external-db
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      HERM_Database__Provider: SqlServer
    ports:
      - "${HERM_HTTP_PORT:-8080}:8080"
    volumes:
      - herm-mapper-app-data:/app/App_Data
    restart: unless-stopped

volumes:
  herm-mapper-app-data:
